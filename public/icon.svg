<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(99, 102, 241, 0.35)" stroke-width="6" />

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#primaryGrad)" stroke-width="5" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Glowing Hex / Badge backplate -->
  <rect x="106" y="106" width="300" height="300" rx="60" fill="url(#primaryGrad)" filter="url(#glow)" opacity="0.35" />

  <!-- Media Layers Stack (SVGA / Motion Symbolism) -->
  <!-- Top Layer / Diamond Stack -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)">
    <!-- Layer 3 (Bottom) -->
    <path d="M 256 370 L 390 305 L 340 280 L 256 322 L 172 280 L 122 305 Z" fill="#4338ca" opacity="0.7" />
    
    <!-- Layer 2 (Middle) -->
    <path d="M 256 320 L 390 255 L 340 230 L 256 272 L 172 230 L 122 255 Z" fill="#6366f1" opacity="0.9" />

    <!-- Layer 1 (Top Hero Surface) -->
    <polygon points="256,150 390,218 256,286 122,218" fill="url(#primaryGrad)" />
    
    <!-- Stylized "S" / Play Sparkle on Top Surface -->
    <path d="M 275 185 Q 295 190 290 205 Q 285 220 256 222 Q 225 224 220 238 Q 215 252 245 256 L 245 264 Q 200 258 205 235 Q 210 215 240 212 Q 270 209 274 198 Q 278 188 255 186 Z" fill="#ffffff" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.5))" />
    
    <!-- Sparkle Stars -->
    <circle cx="340" cy="180" r="8" fill="#38bdf8" />
    <circle cx="170" cy="250" r="6" fill="#c084fc" />
    <circle cx="350" cy="275" r="5" fill="#f43f5e" />
  </g>
</svg>